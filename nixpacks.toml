[build]
# Set backend as the root - this is a PHP/Laravel application only
root = "backend"

[phases.setup]
# Verify environment
cmds = ["php --version"]

[phases.build]
# Install PHP dependencies only (no Node.js/npm)
cmds = [
  "composer install --no-dev --optimize-autoloader --no-ansi --no-interaction --prefer-dist"
]

[phases.build-post]
# Set proper permissions for Laravel directories
cmds = [
  "chmod -R 755 storage bootstrap/cache || true",
  "chmod -R 644 storage bootstrap/cache || true"
]

[phases.release]
# Run Laravel setup commands
cmds = [
  "php artisan migrate --force --no-ansi",
  "php artisan cache:clear",
  "php artisan config:cache",
  "php artisan route:cache"
]

[[processes]]
name = "web"
cmd = "vendor/bin/heroku-php-apache2 public/ -F fpm_config.ini"
