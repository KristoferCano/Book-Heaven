[build]
# Set backend as the root - this is a PHP/Laravel application only
root = "backend"

[phases.build]
# Install only PHP dependencies (no Node.js needed)
cmds = ["composer install --optimize-autoloader --no-dev --no-ansi --no-interaction"]

[phases.release]
# Run Laravel migrations and cache commands
cmds = ["php artisan migrate --force --no-ansi && php artisan cache:clear && php artisan config:cache && php artisan route:cache"]

[[processes]]
name = "web"
cmd = "vendor/bin/heroku-php-apache2 public/ -F fpm_config.ini"
